[project]
name = "lab12-tarea"
version = "0.1.0"
description = "Material del estudiante del Laboratorio 12"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyterlab>=4.6.2",
    "numba>=0.61",
    "numpy>=2.1",
    "pandas>=2.3",
    "plotly>=6.9.0",
    "polars>=1.44.0",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 80
target-version = "py313"
# Los notebooks son material docente: no se reformatean como módulos Python.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
ignore = ["E501", "RUF003"]
