<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 330' width='800' height='330' role='img'><title>Codificación de texto en UTF-8</title><desc>Los caracteres a, ñ y ♪ con su punto de código Unicode y sus bytes en UTF-8: 1, 2 y 3 bytes.</desc><rect width='800' height='330' rx='8' fill='#ffffff' stroke='#57606a'/><text x='400' y='28' font-size='17' text-anchor='middle' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Texto: carácter → número → bytes (UTF-8)</text><text x='30' y='80' font-size='13' text-anchor='start' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Carácter</text><text x='30' y='130' font-size='13' text-anchor='start' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Punto de código Unicode</text><text x='30' y='180' font-size='13' text-anchor='start' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Bytes en UTF-8 (hexadecimal)</text><text x='30' y='235' font-size='13' text-anchor='start' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Cantidad de bytes</text><text x='330' y='86' font-size='34' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>a</text><text x='330' y='130' font-size='16' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>U+0061</text><rect x='308.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='330.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>61</text><text x='330' y='235' font-size='15' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>1 byte</text><text x='500' y='86' font-size='34' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>ñ</text><text x='500' y='130' font-size='16' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>U+00F1</text><rect x='456.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='478.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>C3</text><rect x='500.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='522.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>B1</text><text x='500' y='235' font-size='15' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>2 bytes</text><text x='670' y='86' font-size='34' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>♪</text><text x='670' y='130' font-size='16' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>U+266A</text><rect x='604.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='626.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>E2</text><rect x='648.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='670.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>99</text><rect x='692.0' y='160' width='44' height='30' fill='#aceebb' stroke='#57606a'/><text x='714.0' y='180' font-size='15' text-anchor='middle' font-weight='normal' font-family='Menlo, Consolas, monospace' fill='#1f2328'>AA</text><text x='670' y='235' font-size='15' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>3 bytes</text><text x='30' y='285' font-size='13' text-anchor='start' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Las letras sin tilde, los dígitos y los signos básicos (ASCII) usan 1 byte; el resto usa entre 2 y 4.</text><text x='30' y='308' font-size='13' text-anchor='start' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Un string es una secuencia de caracteres: cuántos bytes ocupa depende de qué caracteres contenga.</text></svg>
