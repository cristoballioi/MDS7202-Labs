 font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>= −32 768</text><text x='400' y='162' font-size='13' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Sumar 1 convierte 0111…1 en 1000…0: cambian los 16 bits y el valor da la vuelta.</text><text x='30' y='196' font-size='14' text-anchor='start' font-weight='bold' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>Flotantes: signo | exponente | mantisa (anchos proporcionales dentro de cada fila)</text><text x='30' y='248' font-size='14' text-anchor='start' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>float32</text><rect x='80' y='228' width='20.0' height='30' fill='#ffd8d3' stroke='#57606a'/><rect x='100.0' y='228' width='160.0' height='30' fill='#b6e3ff' stroke='#57606a'/><rect x='260.0' y='228' width='460.0' height='30' fill='#aceebb' stroke='#57606a'/><text x='180.0' y='248' font-size='13' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>exponente (8)</text><text x='490.0' y='248' font-size='13' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>mantisa (23 bits)</text><text x='104.0' y='223' font-size='11' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>signo</text><text x='30' y='298' font-size='14' text-anchor='start' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>float64</text><rect x='80' y='278' width='10.0' height='30' fill='#ffd8d3' stroke='#57606a'/><rect x='90.0' y='278' width='110.0' height='30' fill='#b6e3ff' stroke='#57606a'/><rect x='200.0' y='278' width='520.0' height='30' fill='#aceebb' stroke='#57606a'/><text x='145.0' y='298' font-size='13' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>exponente (11)</text><text x='460.0' y='298' font-size='13' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>mantisa (52 bits)</text><text x='99.0' y='273' font-size='11' text-anchor='middle' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>signo</text><text x='30' y='350' font-size='13' text-anchor='start' font-weight='normal' font-family='Helvetica, Arial, sans-serif' fill='#1f2328'>La mantisa tiene un largo fijo: por eso casi todo decimal se guarda de forma aproximada.</text></svg>
