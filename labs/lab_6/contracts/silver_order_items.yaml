table: silver.order_items
purpose: >
  Conservar los ítems de cada orden con precios y fletes verificados
  (sin negativos ni valores no finitos) para calcular ventas Gold.
grain: Una fila por (order_id, order_item_id).
primary_key:
  - order_id
  - order_item_id
owner: equipo-datos-pudubella
lineage:
  - bronze.order_items
classification: internal
required_columns:
  - order_id
  - order_item_id
  - product_id
  - seller_id
  - price
  - freight_value
column_types:
  order_id: string
  order_item_id: integer
  price: float
  freight_value: float
allow_empty: false
constraints:
  order_id:
    nullable: false
  price:
    nullable: false
    minimum: 0
    finite: true
  freight_value:
    nullable: false
    minimum: 0
    finite: true
